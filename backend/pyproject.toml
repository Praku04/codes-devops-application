[project]
name = "agentcraft"
version = "1.0.0"
description = "AgentCraft — generate IDE agents, skills, and rules from PRDs or interviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "litellm>=1.55.0",
  "boto3>=1.35.0",
  "pdfplumber>=0.11.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "typer[all]>=0.12.0",
  "rich>=13.9.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[project.scripts]
agentcraft = "agentcraft.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "cli"]
include = ["app*", "agentcraft*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
