<div class="auth-shell">
  <section class="auth-card animate-in">
    <p class="eyebrow">AgentCraft</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to continue your agent workspaces.</p>

    @if (notice) {
      <div class="banner danger-bg" role="alert">
        <strong>Account removed.</strong>
        {{ notice }}
      </div>
    }

    @if (error) {
      <div class="banner danger-bg">{{ error }}</div>
    }

    <form (ngSubmit)="submit()" autocomplete="on">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="you@company.com"
        autocomplete="email"
        required
      />

      <label>Password</label>
      <div class="pw">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <!-- Inline SVG rather than a text glyph: there is no eye character that renders
             the same everywhere (👁 comes out as a colour emoji on Windows), and this
             inherits currentColor so it follows the theme. The slash is always in the
             markup and revealed with CSS — toggling it inside the SVG namespace with @if
             is the sort of thing that breaks quietly. -->
        <button
          type="button"
          class="pw-eye"
          [class.revealed]="showPassword"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
          [title]="showPassword ? 'Hide password' : 'Show password'"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M1.8 12S6 5.2 12 5.2 22.2 12 22.2 12 18 18.8 12 18.8 1.8 12 1.8 12Z" />
            <circle cx="12" cy="12" r="3.1" />
            <line class="slash" x1="3.4" y1="20.6" x2="20.6" y2="3.4" />
          </svg>
        </button>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="busy || !email.trim() || !password">
          {{ busy ? 'Signing in…' : 'Log in' }}
        </button>
      </div>
    </form>

    <p class="muted tiny foot">
      New here?
      <a routerLink="/signup">Create an account</a>
    </p>
  </section>
</div>
