services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Ports come from .env (API_PORT / FRONTEND_PORT) with the same defaults as
    # backend/app/core/config.py, so a port change is one edit in .env.
    ports:
      - "${API_PORT:-8555}:${API_PORT:-8555}"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - agentcraft-data:/data
    environment:
      DATABASE_URL: sqlite:////data/agentcraft.db
      # API_PORT and FRONTEND_PORT come through env_file; they are restated here so the
      # container still starts correctly when .env is absent. CORS needs no entry —
      # cors_origin_list always allows the dev UI on FRONTEND_PORT.
      API_PORT: ${API_PORT:-8555}
      FRONTEND_PORT: ${FRONTEND_PORT:-4225}
      # Empty for a local run. Set it on a server and the CORS allowlist picks up the
      # public origin — without it the container serves an API the browser is not allowed
      # to call from anywhere but loopback.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    working_dir: /app

volumes:
  agentcraft-data:
