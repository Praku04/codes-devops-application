[project]
name = "agentcraft-cli"
version = "1.0.0"
description = "AgentCraft CLI"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
]

[project.scripts]
agentcraft = "agentcraft.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcraft*"]
