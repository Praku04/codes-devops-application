<div class="auth-shell">
  <section class="auth-card animate-in">
    <p class="eyebrow">AgentCraft</p>
    <h1>Create account</h1>
    <p class="muted">
      New accounts need <strong>super admin approval</strong> before you can open the studio.
    </p>

    @if (error) {
      <div class="banner danger-bg">{{ error }}</div>
    }
    @if (success) {
      <div class="banner ok-bg">
        {{ success }}
        <p class="tiny" style="margin: 0.5rem 0 0">
          <a routerLink="/login">Go to log in</a> after you are approved.
        </p>
      </div>
    }

    @if (!success) {
      <form (ngSubmit)="submit()" autocomplete="on">
        <label>Name</label>
        <input type="text" name="name" [(ngModel)]="name" placeholder="Your name" autocomplete="name" />

        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
        />

        <label>Password</label>
        <!-- Each field toggles on its own: revealing both at once would be a surprise,
             and seeing one while typing the other is how you spot a mismatch. The eye is
             inline SVG because no text glyph renders consistently — see login.html. -->
        <div class="pw">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            autocapitalize="off"
            spellcheck="false"
            required
          />
          <button
            type="button"
            class="pw-eye"
            [class.revealed]="showPassword"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            [title]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M1.8 12S6 5.2 12 5.2 22.2 12 22.2 12 18 18.8 12 18.8 1.8 12 1.8 12Z" />
              <circle cx="12" cy="12" r="3.1" />
              <line class="slash" x1="3.4" y1="20.6" x2="20.6" y2="3.4" />
            </svg>
          </button>
        </div>

        <label>Confirm password</label>
        <div class="pw">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter password"
            autocomplete="new-password"
            autocapitalize="off"
            spellcheck="false"
            required
          />
          <button
            type="button"
            class="pw-eye"
            [class.revealed]="showConfirmPassword"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
            [attr.aria-pressed]="showConfirmPassword"
            [title]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M1.8 12S6 5.2 12 5.2 22.2 12 22.2 12 18 18.8 12 18.8 1.8 12 1.8 12Z" />
              <circle cx="12" cy="12" r="3.1" />
              <line class="slash" x1="3.4" y1="20.6" x2="20.6" y2="3.4" />
            </svg>
          </button>
        </div>

        <div class="actions">
          <button
            type="submit"
            [disabled]="busy || !email.trim() || !password || !confirmPassword"
          >
            {{ busy ? 'Submitting…' : 'Request access' }}
          </button>
        </div>
      </form>
    }

    <p class="muted tiny foot">
      Already approved?
      <a routerLink="/login">Log in</a>
    </p>
  </section>
</div>
