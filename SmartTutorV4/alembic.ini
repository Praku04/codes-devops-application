# Used only to draft revisions with the bare `alembic` command, e.g.
#   alembic revision --autogenerate -m "add widget table"
# Applying migrations goes through `python -m core.schema_migrations upgrade`, which takes the
# schema lock. There is deliberately no sqlalchemy.url here: core/migrations/env.py uses the
# application's own engine, so no database credential is ever written into this file.
[alembic]
script_location = %(here)s/core/migrations
prepend_sys_path = .
file_template = v%%(rev)s_%%(slug)s
